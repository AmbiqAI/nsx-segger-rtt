name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Validate metadata and vendored sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release version consistency
        run: |
          manifest=$(jq -r '."."' .release-please-manifest.json)
          module=$(sed -n 's/^  version: //p' nsx-module.yaml)
          test "$manifest" = "$module" || { echo "manifest $manifest != module $module"; exit 1; }

      - name: Check vendored SEGGER checksums
        run: grep -E '^[0-9a-f]{64}  ' SOURCE.md | sha256sum -c

  cmake-smoke:
    name: Cross-compile, link, check placement (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        case: [sram_bss, tcm, m55]
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Configure
        run: cmake -S tests/cmake-smoke -B build/cmake-smoke -DNSX_SMOKE_CASE=${{ matrix.case }}

      - name: Build and link
        run: cmake --build build/cmake-smoke --parallel

      - name: Check RTT section placement
        run: ctest --test-dir build/cmake-smoke --output-on-failure
